[project]
name = "aula_1_2"
version = "0.1.0"
description = "aula_1_2 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.148.0,<1.0.0"
]

[project.scripts]
aula_1_2 = "aula_1_2.main:run"
run_crew = "aula_1_2.main:run"
train = "aula_1_2.main:train"
replay = "aula_1_2.main:replay"
test = "aula_1_2.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
